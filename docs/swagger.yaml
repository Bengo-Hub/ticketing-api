host: ticketingapi.codevertexafrica.com
info:
  contact: {}
  description: Codevertex Ticketing Service — ticket lifecycle, SLA, KB, real-time
    SSE
  title: Ticketing API
  version: "1.0"
paths:
  /{tenant}/agents:
    get:
      description: List support agents for the authenticated tenant
      parameters:
      - description: Tenant slug
        in: path
        name: tenant
        type: string
      - description: Filter by team UUID
        in: query
        name: teamId
        type: string
      - description: Filter by agent status
        in: query
        name: status
        type: string
      - description: Filter by agent role
        in: query
        name: role
        type: string
      - description: Filter by active status
        in: query
        name: active
        type: boolean
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Results per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List agents
      tags:
      - identity
    post:
      consumes:
      - application/json
      description: Create a new support agent for the authenticated tenant
      parameters:
      - description: Tenant slug
        in: path
        name: tenant
        required: true
        type: string
      - description: Agent payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_identity.CreateAgentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_modules_identity.Agent'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create agent
      tags:
      - identity
  /{tenant}/categories:
