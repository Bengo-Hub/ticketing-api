      - description: Article slug
        in: path
        name: slug
        required: true
        type: string
      - description: false reads without counting a view (default true)
        in: query
        name: count_view
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_kb.PublicArticle'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get public KB article by slug
      tags:
      - kb-public
  /{tenant}/kb/categories:
    get:
