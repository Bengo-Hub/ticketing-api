      reopened_at:
        type: string
      resolved_at:
        type: string
      sla_calendar_name:
        type: string
      sla_first_response_minutes:
        description: The elapsed minutes to first response and to resolution in the
          policy's clock, net of pauses.
        type: integer
      sla_paused_at:
        description: SLAPausedAt is set while a pending status stops the SLA clock.
        type: string
      sla_paused_minutes:
        type: integer
      sla_policy_id:
        type: string
      sla_policy_name:
        description: |-
          SLAPolicyName and SLACalendarName name the policy and the business calendar its clock counts
          in. They are read with the ticket (one batched lookup per page, never stored on the ticket).
          SLACalendarName is empty for a policy that counts every minute (24x7).
        type: string
      sla_resolution_breached:
        type: boolean
      sla_resolution_due_at:
        type: string
      sla_resolution_minutes:
        type: integer
      sla_response_breached:
        type: boolean
      sla_response_due_at:
        type: string
      status:
        $ref: '#/definitions/internal_modules_tickets.TicketStatus'
      subject:
        type: string
      tags:
        items:
          type: string
        type: array
      tenant_id:
        type: string
      ticket_number:
        type: string
      updated_at:
        type: string
      whatsapp_window_expires_at:
        description: |-
          WhatsAppWindowExpiresAt is when the 24-hour WhatsApp reply window closes (derived from
          metadata whatsapp_last_inbound_at, never stored); null for other channels and for a
          WhatsApp ticket with no inbound message yet.
        type: string
    type: object
  internal_modules_tickets.TicketAttachment:
    properties:
      comment_id:
        type: string
      content_type:
        type: string
      created_at:
        type: string
      filename:
        type: string
      id:
        type: string
      internal:
        description: Internal attachments belong to an internal note and are never
          shown to the customer.
        type: boolean
      metadata:
        additionalProperties: {}
        type: object
      size:
        type: integer
      tenant_id:
        type: string
      ticket_id:
        type: string
      uploaded_by_id:
        type: string
    type: object
  internal_modules_tickets.TicketCategory:
    properties:
      created_at:
        type: string
      description:
        type: string
      icon:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      metadata:
        additionalProperties: {}
        type: object
      name:
        type: string
      parent_id:
        type: string
      sort_order:
        type: integer
      tenant_id:
        type: string
      updated_at:
        type: string
    type: object
  internal_modules_tickets.TicketChannel:
    enum:
    - web
    - email
    - api
    - chat
    - whatsapp
    - phone
    - internal
    type: string
    x-enum-varnames:
    - ChannelWeb
    - ChannelEmail
    - ChannelAPI
    - ChannelChat
    - ChannelWhatsApp
    - ChannelPhone
    - ChannelInternal
  internal_modules_tickets.TicketComment:
    properties:
      author_id:
        type: string
      author_name:
        description: |-
          AuthorName is who the conversation shows: the agent's display name for staff, the
          requester's name for a customer and "System" for a system comment. It is resolved when the
          comments are read (one batched lookup per page), never stored. Empty when no name is known.
        type: string
      author_type:
        $ref: '#/definitions/internal_modules_tickets.AuthorType'
      channel:
        description: |-
          Channel, ExternalID, Sender and EmailSubject describe a customer message that came in on a
          channel (email or WhatsApp). They are read from the comment metadata, never stored apart,
          and are empty on every other comment.
        type: string
      comment_type:
        $ref: '#/definitions/internal_modules_tickets.CommentType'
      content:
        type: string
      created_at:
        type: string
      email_subject:
        type: string
      external_id:
        type: string
      id:
        type: string
      mentions:
        description: Mentions are the agent ids the comment @mentions (staff comments
          only).
        items:
          type: string
        type: array
      metadata:
        additionalProperties: {}
        type: object
      sender:
        $ref: '#/definitions/internal_modules_tickets.CommentSender'
      tenant_id:
        type: string
      ticket_id:
        type: string
      updated_at:
        type: string
    type: object
  internal_modules_tickets.TicketLink:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      from_ticket_id:
        type: string
      id:
        type: string
      kind:
        $ref: '#/definitions/internal_modules_tickets.LinkKind'
      to_ticket_id:
        type: string
    type: object
  internal_modules_tickets.TicketPriority:
    enum:
    - low
    - normal
    - high
    - urgent
    - critical
    type: string
    x-enum-varnames:
    - PriorityLow
    - PriorityNormal
    - PriorityHigh
    - PriorityUrgent
    - PriorityCritical
  internal_modules_tickets.TicketStatus:
    enum:
    - new
    - open
    - in_progress
    - pending_customer
    - pending_internal
    - resolved
    - closed
    - cancelled
    type: string
    x-enum-varnames:
    - StatusNew
    - StatusOpen
    - StatusInProgress
    - StatusPendingCustomer
    - StatusPendingInternal
    - StatusResolved
    - StatusClosed
    - StatusCancelled
  internal_modules_tickets.TicketView:
    properties:
      created_at:
        type: string
      filters:
        additionalProperties: {}
        type: object
      id:
        type: string
      name:
        type: string
      owner_user_id:
        type: string
      shared:
        type: boolean
      sort:
        type: string
      updated_at:
        type: string
    type: object
  internal_modules_tickets.ViewInput:
    properties:
      filters:
        additionalProperties: {}
        type: object
      name:
        type: string
      shared:
        type: boolean
      sort:
        type: string
    type: object
host: ticketingapi.codevertexafrica.com
info:
  contact: {}
  description: Codevertex Ticketing Service — ticket lifecycle, SLA, KB, real-time
    SSE
  title: Ticketing API
  version: "1.0"
paths:
  /{tenant}/agents:
    get:
      description: List support agents for the authenticated tenant, newest first,
        as {data, next_cursor, has_more}
      parameters:
      - description: Tenant slug
        in: path
        name: tenant
        type: string
      - description: Filter by team UUID
        in: query
        name: teamId
        type: string
      - description: Filter by agent status
        in: query
        name: status
        type: string
      - description: Filter by agent role
        in: query
        name: role
        type: string
      - description: Filter by active status
        in: query
        name: active
        type: boolean
      - description: next_cursor of the previous page
        in: query
        name: cursor
        type: string
      - description: Page size (default 25, max 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List agents
      tags:
      - identity
    post:
      consumes:
      - application/json
      description: Create a new support agent for the authenticated tenant
      parameters:
      - description: Tenant slug
        in: path
        name: tenant
        required: true
        type: string
      - description: Agent payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_identity.CreateAgentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_modules_identity.Agent'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create agent
      tags:
      - identity
  /{tenant}/agents/available:
    get:
      parameters:
      - description: Tenant slug
        in: path
        name: tenant
        type: string
      - description: Filter by team UUID
        in: query
        name: teamId
        type: string
      - description: At most this many agents (default 50, max 200)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Available agents
      tags:
      - identity
  /{tenant}/ai/classify:
    post:
      consumes:
      - application/json
      description: marketflow-ai classifies the draft; the label is matched to the
        tenant's categories and the team comes from its routing rules. Spends one
        AI credit (none for the platform owner). Send Idempotency-Key to make a retry
        free.
      parameters:
      - description: Tenant slug
        in: path
        name: tenant
        required: true
        type: string
      - description: 'Request key, 8 to 100 of A-Z a-z 0-9 . _ : -'
        in: header
        name: Idempotency-Key
        type: string
      - description: Draft
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_ai.ClassifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_ai.Classification'
        "402":
          description: ai_credits_exhausted
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: ai_unavailable or ai_credits_unknown
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: AI classify a draft ticket
      tags:
      - ai
  /{tenant}/ai/tickets/{ticketId}/kb-draft:
    post:
      description: Saved as a private draft (status draft, is_public false), never
        published. The ticket must be resolved or closed. Spends one AI credit.
      parameters:
      - description: Tenant slug
        in: path
        name: tenant
        required: true
        type: string
      - description: Ticket ID
        in: path
        name: ticketId
        required: true
        type: string
      - description: Request key
        in: header
        name: Idempotency-Key
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_modules_ai.KBDraft'
        "402":
          description: Payment Required
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: ticket_not_resolved
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: AI article draft from a resolved ticket
      tags:
      - ai
  /{tenant}/ai/tickets/{ticketId}/kb-suggestions:
    post:
      description: Up to 5 of the tenant's published articles, best first. With no
        published article the list is empty and nothing is spent; otherwise one AI
        credit.
      parameters:
      - description: Tenant slug
        in: path
        name: tenant
        required: true
        type: string
      - description: Ticket ID
        in: path
        name: ticketId
        required: true
        type: string
      - description: Request key
        in: header
        name: Idempotency-Key
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_ai.KBSuggestions'
        "402":
          description: Payment Required
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: AI knowledge base suggestions
      tags:
      - ai
  /{tenant}/ai/tickets/{ticketId}/reply:
    post:
      description: A draft reply to the customer's latest public message. It is only
        returned; the agent edits it and posts it as a comment. Spends one AI credit.
      parameters:
      - description: Tenant slug
        in: path
        name: tenant
        required: true
        type: string
      - description: Ticket ID
        in: path
        name: ticketId
        required: true
        type: string
      - description: Request key
        in: header
        name: Idempotency-Key
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_ai.ReplySuggestion'
        "402":
          description: Payment Required
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: AI suggested reply
      tags:
      - ai
  /{tenant}/ai/tickets/{ticketId}/summary:
    post:
      description: Internal notes are included (staff only). Spends one AI credit.
      parameters:
      - description: Tenant slug
        in: path
        name: tenant
        required: true
        type: string
      - description: Ticket ID
        in: path
        name: ticketId
        required: true
        type: string
      - description: Request key
        in: header
        name: Idempotency-Key
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_ai.Summary'
        "402":
          description: Payment Required
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: AI summary of a ticket thread
      tags:
      - ai
  /{tenant}/categories:
    get:
      parameters:
      - description: Tenant slug
        in: path
        name: tenant
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List categories
      tags:
      - categories
    post:
      consumes:
      - application/json
      parameters:
      - description: Tenant slug
        in: path
        name: tenant
        required: true
        type: string
      - description: Category payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_tickets.CreateCategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_modules_tickets.TicketCategory'
      security:
      - BearerAuth: []
      summary: Create category
      tags:
      - categories
  /{tenant}/kb/admin/articles:
    get:
      description: 'Staff list of knowledge base articles, keyset paged: pass next_cursor
        back as cursor while has_more is true'
      parameters:
      - description: Tenant slug
        in: path
        name: tenant
        required: true
        type: string
      - description: Search text
        in: query
        name: search
        type: string
      - description: Filter by category
        in: query
        name: category
        type: string
      - description: Filter by status
        in: query
        name: status
        type: string
      - description: next_cursor of the previous page
        in: query
        name: cursor
        type: string
      - description: Page size (default 20, at most 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List KB articles
      tags:
      - kb
  /{tenant}/kb/articles:
    get:
      description: Published public articles of the tenant, newest first, without
