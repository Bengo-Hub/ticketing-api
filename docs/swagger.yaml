        article counts, by name
      parameters:
      - description: Tenant slug
        in: path
        name: tenant
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List public KB categories
      tags:
      - kb-public
  /{tenant}/kb/suggestions:
    get:
      description: Up to 5 published public articles matching the words of a ticket
        subject, best first, without the body. No AI and no credits
      parameters:
      - description: Tenant slug
        in: path
        name: tenant
        required: true
        type: string
      - description: The subject typed so far
        in: query
        name: q
        required: true
        type: string
      - description: At most 5
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Suggest public KB articles
      tags:
      - kb-public
  /{tenant}/macros:
    get:
      parameters:
      - description: Tenant slug
        in: path
        name: tenant
        required: true
        type: string
      - description: Only active macros
        in: query
        name: active
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List macros
      tags:
      - macros
    post:
      consumes:
