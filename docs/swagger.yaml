      - kb
  /{tenant}/kb/articles/{articleId}:
    get:
      description: Retrieve a knowledge base article by its UUID
      parameters:
      - description: Tenant slug
        in: path
        name: tenant
        required: true
        type: string
      - description: Article UUID
        in: path
        name: articleId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_kb.Article'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
